namespace: popquiz

backend:
  name: popquiz-backend
  image: abhaytopno/popquiz-backend:v12
  port: 5000
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      cpu: '500m'
      memory: '512Mi'
  secretName: backend-secrets

frontend:
  name: popquiz-frontend
  image: abhaytopno/popquiz-frontend:v12
  port: 3000
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      cpu: '500m'
      memory: '512Mi'
  configMapName: frontend-secrets

langchain:
  name: popquiz-langchain
  image: abhaytopno/popquiz-langchain:v1
  port: 8000
  resources:
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '500m'
      memory: '512Mi'
  secretName: langchain-secrets

ingress:
  className: nginx
